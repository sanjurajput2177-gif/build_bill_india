name: build_bill_india
description: A construction billing and estimation app.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  pdf: ^3.12.0
  printing: ^5.11.0
  path_provider: ^2.1.2
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  uuid: ^4.3.3
  path: ^1.9.1
  flutter_web_browser: ^0.17.3
  google_mobile_ads: ^5.1.0
  flutter_cashfree_pg_sdk: ^2.3.2+49

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo.png"
  android_12:
    image: "assets/logo.png"
    color: "#ffffff"
  dark_color: "#ffffff"
  dark_image: "assets/logo.png"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
